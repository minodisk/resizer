version: '2'

services:

  app:
    environment:
      RESIZER_ENV: test
    volumes:
      - ./.logs:/go/src/github.com/go-microservices/resizer/.logs
    command: |-
      sh -c " \
        go test \
          -bench . \
          -benchmem \
          . \
          ./fetcher/... \
          ./input/... \
          ./option/... \
          ./processor/... \
          ./server/... \
          ./storage/... \
          ./uploader/... \
        | \
        tee ./.logs/`date +'%Y%m%d%H%M%S'`.log \
        && \
        benchcmp ./.logs/`ls -t -r .logs | head -1` ./.logs/`ls -t .logs | head -1` \
      "
